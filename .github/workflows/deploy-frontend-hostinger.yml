name: Deploy Frontend to Hostinger

on:
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend-hostinger.yml"
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Build and deploy frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_DEMO_MODE: "false"
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Verify output
        run: |
          test -d frontend/out
          test -f frontend/out/index.html
          ls -la frontend/out | head

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./frontend/out/
          server-dir: /public_html/educore/
          state-name: .ftp-deploy-sync-state-v2.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/Thumbs.db

      - name: Record deployment in EduCore
        if: always()
        env:
          EDUCORE_DEPLOY_WEBHOOK_URL: ${{ secrets.EDUCORE_DEPLOY_WEBHOOK_URL }}
          EDUCORE_DEPLOY_WEBHOOK_SECRET: ${{ secrets.EDUCORE_DEPLOY_WEBHOOK_SECRET }}
          JOB_STATUS: ${{ job.status }}
          GITHUB_REF_NAME_VALUE: ${{ github.ref_name }}
          GITHUB_ACTOR_VALUE: ${{ github.actor }}
          GITHUB_REPOSITORY_VALUE: ${{ github.repository }}
          GITHUB_WORKFLOW_VALUE: ${{ github.workflow }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_NUMBER_VALUE: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          if [ -z "${EDUCORE_DEPLOY_WEBHOOK_URL}" ] || [ -z "${EDUCORE_DEPLOY_WEBHOOK_SECRET}" ]; then
            echo "::warning::Deployment history webhook secrets (EDUCORE_DEPLOY_WEBHOOK_URL / EDUCORE_DEPLOY_WEBHOOK_SECRET) not configured — skipping."
            exit 0
          fi

          # Map job.status to EduCore allowed values
          raw_status="$(echo "${JOB_STATUS}" | tr '[:upper:]' '[:lower:]')"
          case "${raw_status}" in
            success)   deploy_status="success" ;;
            failure)   deploy_status="failure" ;;
            cancelled) deploy_status="cancelled" ;;
            *)         deploy_status="failure" ;;
          esac

          commit_title="$(git log -1 --pretty=%s 2>/dev/null || echo 'Deploy frontend')"
          commit_description="$(git log -1 --pretty=%b 2>/dev/null || echo '')"
          if [ -z "${commit_description}" ]; then
            commit_description="Deploy automatico del frontend a Hostinger desde GitHub Actions."
          fi

          COMMIT_TITLE="${commit_title}" COMMIT_DESCRIPTION="${commit_description}" DEPLOY_STATUS="${deploy_status}" node <<'NODE'
          const fs = require("fs");
          const payload = {
            environment: "production",
            service: "frontend",
            provider: "github_actions",
            status: process.env.DEPLOY_STATUS || "failure",
            title: process.env.COMMIT_TITLE || "Deploy Frontend to Hostinger",
            description: process.env.COMMIT_DESCRIPTION,
            commit_sha: process.env.GITHUB_SHA,
            commit_short_sha: (process.env.GITHUB_SHA || "").slice(0, 7),
            branch: process.env.GITHUB_REF_NAME_VALUE,
            actor: process.env.GITHUB_ACTOR_VALUE,
            repository: process.env.GITHUB_REPOSITORY_VALUE,
            workflow_name: process.env.GITHUB_WORKFLOW_VALUE,
            run_id: process.env.GITHUB_RUN_ID_VALUE,
            run_number: process.env.GITHUB_RUN_NUMBER_VALUE,
            run_attempt: process.env.GITHUB_RUN_ATTEMPT_VALUE,
            run_url: `https://github.com/${process.env.GITHUB_REPOSITORY_VALUE}/actions/runs/${process.env.GITHUB_RUN_ID_VALUE}`,
          };
          fs.writeFileSync("deployment-payload.json", JSON.stringify(payload));
          NODE

          http_code="$(curl -sS -o /tmp/educore-deployment-record-response.json -w "%{http_code}" \
            -X POST "${EDUCORE_DEPLOY_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-EduCore-Deploy-Secret: ${EDUCORE_DEPLOY_WEBHOOK_SECRET}" \
            --data @deployment-payload.json)"
          curl_status=$?

          if [ "${curl_status}" -ne 0 ]; then
            echo "::warning::Could not reach EduCore deployment webhook (curl error ${curl_status})."
            exit 0
          fi

          case "${http_code}" in
            2*) echo "Deployment history recorded in EduCore (status=${deploy_status})." ;;
            *) echo "::warning::EduCore deployment history webhook returned HTTP ${http_code}." ;;
          esac
