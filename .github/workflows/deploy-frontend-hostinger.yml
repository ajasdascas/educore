name: Deploy Frontend to Hostinger

# ─────────────────────────────────────────────────────────────
# ÚNICO flujo automático del frontend estático de EduCore.
# Destino canónico: https://onlineu.mx/educore/  (basePath /educore).
# Hostinger solo sirve archivos estáticos — no ejecuta Node.
#
# El workflow duplicado antiguo (deploy.yml) fue archivado en
# .github/workflows-disabled/ para evitar dos builds por push.
# ─────────────────────────────────────────────────────────────

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend-hostinger.yml"
  workflow_dispatch: {}

# Evita despliegues simultáneos (dos pushes seguidos no lanzan dos deploys).
concurrency:
  group: educore-frontend-production
  cancel-in-progress: true

jobs:
  deploy-frontend:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Guard: sin NEXT_PUBLIC_API_URL el build queda mal configurado (login roto).
      - name: Validate required secret
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          if [ -z "${NEXT_PUBLIC_API_URL}" ]; then
            echo "::error::Falta el secret NEXT_PUBLIC_API_URL. Configúralo con la URL pública del backend (https://...)."
            exit 1
          fi
          case "${NEXT_PUBLIC_API_URL}" in
            https://*) : ;;
            *) echo "::error::NEXT_PUBLIC_API_URL debe ser https://"; exit 1 ;;
          esac
          echo "NEXT_PUBLIC_API_URL presente y HTTPS ✓"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_DEMO_MODE: "false"
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Verify output artifacts
        run: |
          set -e
          test -f frontend/out/index.html
          test -f frontend/out/login/index.html
          test -f frontend/out/escuela/index.html
          test -f frontend/out/super-admin/dashboard/index.html
          test -d frontend/out/_next
          echo "✓ Artefactos críticos presentes en frontend/out/"
          # Asegura que NO quede la URL muerta de Railway horneada.
          if grep -rq "educore-production-beef.up.railway.app" frontend/out/; then
            echo "::error::El build contiene la URL muerta de Railway. Revisa NEXT_PUBLIC_API_URL."
            exit 1
          fi
          echo "✓ Sin URL de Railway obsoleta en el build"
          du -sh frontend/out/

      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      # Despliegue estático resiliente (FTPS explícito → FTP plano → FTPS implícito → SFTP).
      # SIN --delete: no borra archivos remotos en este flujo (rollback más seguro).
      - name: Deploy to Hostinger (FTP/FTPS/SFTP)
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          # Ruta remota confirmada por FTP. Default explícito; overridable por secret.
          FTP_TARGET_DIR: ${{ secrets.HOSTINGER_FTP_TARGET_DIR || '/domains/onlineu.mx/public_html/educore/' }}
        run: |
          if [ -z "${FTP_HOST}" ] || [ -z "${FTP_USER}" ] || [ -z "${FTP_PASS}" ]; then
            echo "::error::Faltan secrets FTP de Hostinger (HOSTINGER_FTP_SERVER/USERNAME/PASSWORD)."
            exit 1
          fi

          cat <<'EOF' > ftp-deploy.lftp
          set cmd:fail-exit yes
          set ftp:passive-mode yes
          set ftp:prefer-epsv false
          set ssl:verify-certificate no
          set dns:order inet
          set net:timeout 30
          set net:max-retries 2
          set net:reconnect-interval-base 5

          open_explicit_ftps() { set ftp:ssl-force true;  set ftp:ssl-protect-data true;  open -u "${FTP_USER},${FTP_PASS}" "ftp://${FTP_HOST}:21"; }
          open_plain_ftp()     { set ftp:ssl-force false; set ftp:ssl-protect-data false; open -u "${FTP_USER},${FTP_PASS}" "ftp://${FTP_HOST}:21"; }
          open_implicit_ftps() { set ftp:ssl-force true;  set ftp:ssl-protect-data true;  open -u "${FTP_USER},${FTP_PASS}" "ftps://${FTP_HOST}:990"; }
          open_sftp()          { open -u "${FTP_USER},${FTP_PASS}" "sftp://${FTP_HOST}:22"; }

          try_deploy() {
            cd "${FTP_TARGET_DIR}"
            mirror --reverse --verbose --parallel=2 --exclude-glob .git* --exclude-glob node_modules/** frontend/out/ .
          }
          EOF

          for mode in explicit_ftps plain_ftp implicit_ftps sftp; do
            for attempt in 1 2; do
              echo "Deploy mode=${mode} attempt=${attempt}/2"
              if timeout 240s lftp -e "source ftp-deploy.lftp; open_${mode}; try_deploy; bye"; then
                echo "Deploy OK (mode=${mode})"
                exit 0
              fi
              sleep 10
            done
          done
          echo "::error::Deploy falló: ningún modo de conexión funcionó."
          exit 1

      - name: Smoke test público
        run: |
          echo "Probando https://onlineu.mx/educore/ ..."
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 https://onlineu.mx/educore/login/ || echo "000")
          echo "login/ -> HTTP ${code}"
          [ "${code}" = "200" ] || echo "::warning::login/ no devolvió 200 (revisar propagación/ruta)."

      # Registro de historial (best-effort; no falla el deploy si no está configurado).
      - name: Record deployment in EduCore
        if: ${{ always() }}
        env:
          EDUCORE_DEPLOY_WEBHOOK_URL: ${{ secrets.EDUCORE_DEPLOY_WEBHOOK_URL }}
          EDUCORE_DEPLOY_WEBHOOK_SECRET: ${{ secrets.EDUCORE_DEPLOY_WEBHOOK_SECRET }}
        run: |
          if [ -z "${EDUCORE_DEPLOY_WEBHOOK_URL}" ] || [ -z "${EDUCORE_DEPLOY_WEBHOOK_SECRET}" ]; then
            echo "Historial de deploy no configurado (opcional)."
            exit 0
          fi
          payload=$(printf '{"environment":"production","service":"frontend","provider":"github_actions","status":"%s","commit_sha":"%s","branch":"%s","run_id":"%s"}' \
            "${{ job.status }}" "${GITHUB_SHA}" "${GITHUB_REF_NAME}" "${GITHUB_RUN_ID}")
          curl -sS -X POST "${EDUCORE_DEPLOY_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-EduCore-Deploy-Secret: ${EDUCORE_DEPLOY_WEBHOOK_SECRET}" \
            --data "${payload}" -o /dev/null -w "webhook -> HTTP %{http_code}\n" || echo "::warning::No se pudo registrar el deploy."
