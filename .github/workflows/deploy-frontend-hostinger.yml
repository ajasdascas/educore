name: Deploy Frontend to Hostinger

on:
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend-hostinger.yml"
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_DEMO_MODE: "false"
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Verify output
        run: |
          test -d frontend/out
          test -f frontend/out/index.html
          test -f frontend/out/school-admin/incidents/index.html
          test -f frontend/out/school-admin/daily-logs/index.html
          test -f frontend/out/school-admin/kinder/incidents/index.html
          echo "✓ All critical route HTMLs present in frontend/out/"
          ls -la frontend/out | head

      - name: Audit navigation routes
        run: node scripts/audit-all-visible-routes-deep.js

      - name: Diagnose FTP connectivity
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_SERVER }}
        run: |
          echo "── Runner public IP ──"
          curl -s https://api.ipify.org || true
          echo ""
          echo "── DNS resolution ──"
          getent hosts "$FTP_HOST" || true
          echo "── TCP connectivity to port 21 ──"
          nc -vz -w 10 "$FTP_HOST" 21 || true
          echo "── TCP connectivity to port 22 (SFTP) ──"
          nc -vz -w 10 "$FTP_HOST" 22 || true
          echo "── Done ──"

      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy to Hostinger (FTP/FTPS/SFTP)
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          FTP_TARGET_DIR: /public_html/educore/
        run: |
          cat <<'EOF' > ftp-deploy.lftp
          set cmd:fail-exit yes
          set ftp:passive-mode yes
          set ftp:prefer-epsv false
          set ssl:verify-certificate no
          set dns:order inet
          set net:timeout 30
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 1

          open_implicit_ftps() {
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            open -u "${FTP_USER},${FTP_PASS}" "ftps://${FTP_HOST}:990"
          }

          open_explicit_ftps() {
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            open -u "${FTP_USER},${FTP_PASS}" "ftp://${FTP_HOST}:21"
          }

          open_plain_ftp() {
            set ftp:ssl-force false
            set ftp:ssl-protect-data false
            open -u "${FTP_USER},${FTP_PASS}" "ftp://${FTP_HOST}:21"
          }

          open_sftp() {
            open -u "${FTP_USER},${FTP_PASS}" "sftp://${FTP_HOST}:22"
          }

          try_deploy() {
            cd "${FTP_TARGET_DIR}"
            mirror --reverse --verbose --parallel=2 --delete --exclude-glob .git* --exclude-glob node_modules/** frontend/out/ .
          }
          EOF

          for mode in explicit_ftps plain_ftp implicit_ftps sftp; do
            for attempt in 1 2 3; do
              echo "Deploy mode=${mode} attempt=${attempt}/3"
              if timeout 240s lftp -e "source ftp-deploy.lftp; open_${mode}; try_deploy; bye"; then
                exit 0
              fi
              sleep 10
            done
          done

          echo "Deploy failed: no connection mode succeeded (explicit_ftps/plain_ftp/implicit_ftps/sftp)."
          exit 1

      - name: Record deployment in EduCore
        env:
          EDUCORE_DEPLOY_WEBHOOK_URL: ${{ secrets.EDUCORE_DEPLOY_WEBHOOK_URL }}
          EDUCORE_DEPLOY_WEBHOOK_SECRET: ${{ secrets.EDUCORE_DEPLOY_WEBHOOK_SECRET }}
          GITHUB_REF_NAME_VALUE: ${{ github.ref_name }}
          GITHUB_ACTOR_VALUE: ${{ github.actor }}
          GITHUB_REPOSITORY_VALUE: ${{ github.repository }}
          GITHUB_WORKFLOW_VALUE: ${{ github.workflow }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_NUMBER_VALUE: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          if [ -z "${EDUCORE_DEPLOY_WEBHOOK_URL}" ] || [ -z "${EDUCORE_DEPLOY_WEBHOOK_SECRET}" ]; then
            echo "::warning::Deployment history webhook is not configured."
            exit 0
          fi

          commit_title="$(git log -1 --pretty=%s)"
          commit_description="$(git log -1 --pretty=%b)"
          if [ -z "${commit_description}" ]; then
            commit_description="Deploy automatico del frontend a Hostinger desde GitHub Actions."
          fi

          COMMIT_TITLE="${commit_title}" COMMIT_DESCRIPTION="${commit_description}" node <<'NODE'
          const fs = require("fs");
          const payload = {
            environment: "production",
            service: "frontend",
            provider: "github_actions",
            status: "success",
            title: process.env.COMMIT_TITLE,
            description: process.env.COMMIT_DESCRIPTION,
            commit_sha: process.env.GITHUB_SHA,
            commit_short_sha: (process.env.GITHUB_SHA || "").slice(0, 7),
            branch: process.env.GITHUB_REF_NAME_VALUE,
            actor: process.env.GITHUB_ACTOR_VALUE,
            repository: process.env.GITHUB_REPOSITORY_VALUE,
            workflow_name: process.env.GITHUB_WORKFLOW_VALUE,
            run_id: process.env.GITHUB_RUN_ID_VALUE,
            run_number: process.env.GITHUB_RUN_NUMBER_VALUE,
            run_attempt: process.env.GITHUB_RUN_ATTEMPT_VALUE,
            run_url: `https://github.com/${process.env.GITHUB_REPOSITORY_VALUE}/actions/runs/${process.env.GITHUB_RUN_ID_VALUE}`,
          };
          fs.writeFileSync("deployment-payload.json", JSON.stringify(payload));
          NODE

          http_code="$(curl -sS -o /tmp/educore-deployment-record-response.json -w "%{http_code}" \
            -X POST "${EDUCORE_DEPLOY_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-EduCore-Deploy-Secret: ${EDUCORE_DEPLOY_WEBHOOK_SECRET}" \
            --data @deployment-payload.json)"
          curl_status=$?

          if [ "${curl_status}" -ne 0 ]; then
            echo "::warning::Could not record deployment in EduCore."
            exit 0
          fi

          case "${http_code}" in
            2*) echo "Deployment history recorded in EduCore." ;;
            *) echo "::warning::EduCore deployment history webhook returned HTTP ${http_code}." ;;
          esac
