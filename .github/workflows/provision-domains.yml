name: EduCore — School Domain Provisioner

# ─── Triggers ────────────────────────────────────────────────────────────────
on:
  # Manually: provide a slug to provision a single school
  workflow_dispatch:
    inputs:
      slug:
        description: "School slug (e.g. kinder1)"
        required: true
        type: string
      name:
        description: "School display name (optional)"
        required: false
        type: string
        default: ""
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - provision        # provision-school-domain.js (after DB creation)
          - check            # check-school-domain.js     (verify DNS + API)
        default: provision

  # Scheduled: daily health check of all school subdomains (optional)
  # Uncomment to enable:
  # schedule:
  #   - cron: "0 9 * * 1"  # Every Monday 9am UTC

jobs:
  provision-school:
    if: ${{ github.event.inputs.action == 'provision' || github.event.inputs.action == 'check' }}
    runs-on: ubuntu-latest
    env:
      DOMAIN: onlineu.mx
      # URL del backend desde secret (la de Railway anterior ya no existe).
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      HOSTINGER_HOSTING_USERNAME: ${{ secrets.HOSTINGER_HOSTING_USERNAME }}
      HOSTINGER_WEBSITE_DOMAIN: onlineu.mx
      HOSTINGER_SUBDOMAIN_DIRECTORY: educore
      SCHOOL_SLUG_INPUT: ${{ github.event.inputs.slug }}
      SCHOOL_NAME_INPUT: ${{ github.event.inputs.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: "20"

      - name: Provision school domain
        if: ${{ github.event.inputs.action == 'provision' }}
        run: |
          node scripts/provision-school-domain.js \
            --slug="${SCHOOL_SLUG_INPUT}" \
            --name="${SCHOOL_NAME_INPUT}"

      - name: Check school domain
        if: ${{ github.event.inputs.action == 'check' }}
        run: |
          node scripts/check-school-domain.js "${SCHOOL_SLUG_INPUT}" --verbose
